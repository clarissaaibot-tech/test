<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seat View · Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../shared/engine.js"></script>
<script>
(() => {
// Dining room on the 32nd floor. Glass wall at z = 0 looks out over the sea (toward -z). Room runs z 0..12.
const FLOOR_H = 112, RAISE = 0.45;
const MX = x => 50 + x * 3.8, MY = z => 12 + z * 5.6;
const seats = [], tables = [];
let tNo = 0;
const add = (t, x, z, y, rot, desc, letter, tier) => seats.push({ t, x, y, z, rot, desc, tier, name: `Table ${t} · ${desc}`, short: `T${t}${letter}`, mx: MX(x), my: MY(z), size: tables[tables.length - 1].size });
// window tables for two
[-9, -4.5, 0, 4.5, 9].forEach(x => { const t = ++tNo, z = 1.7; tables.push({ t, x, z, y: 0, r: 0.42, size: 2 });
  add(t, x, z + 0.7, 0, 0, 'faces the window', 'A', 'prem'); add(t, x, z - 0.7, 0, Math.PI, 'back to the window', 'B', 'prem'); });
// middle tables for four
[-7, -2.3, 2.3, 7].forEach(x => { const t = ++tNo, z = 5.4; tables.push({ t, x, z, y: 0, r: 0.6, size: 4, square: true });
  add(t, x, z + 0.8, 0, 0, 'faces the window', 'A', 'std'); add(t, x, z - 0.8, 0, Math.PI, 'back to the window', 'B', 'std');
  add(t, x - 0.8, z, 0, -Math.PI / 2, 'side seat, left', 'C', 'std'); add(t, x + 0.8, z, 0, Math.PI / 2, 'side seat, right', 'D', 'std'); });
// raised banquette tables for two
[-6.8, -2.3, 2.3, 6.8].forEach(x => { const t = ++tNo, z = 9.4; tables.push({ t, x, z, y: RAISE, r: 0.42, size: 2 });
  add(t, x, z + 0.7, RAISE, 0, 'banquette, faces the window', 'A', 'std'); add(t, x, z - 0.7, RAISE, Math.PI, 'back to the window', 'B', 'std'); });

const decor = `
  <rect x="2" y="${MY(0) - 2.2}" width="96" height="2.2" fill="#9ec6e0" opacity=".55"/>
  <text x="50" y="${MY(0) - 4}" text-anchor="middle" font-size="2.6" letter-spacing="1" fill="#9a8f89" font-family="IBM Plex Mono,monospace">GLASS WALL · SEA VIEW</text>
  <rect x="${MX(-9.8)}" y="${MY(8.2)}" width="${19.6 * 3.8}" height="${3.6 * 5.6}" rx="1.5" fill="#1d1617" stroke="#3a2e30" stroke-width=".3"/>
  <text x="50" y="${MY(11.6)}" text-anchor="middle" font-size="2" fill="#9a8f89" font-family="IBM Plex Mono,monospace">RAISED PLATFORM +45 cm</text>
  ${tables.map(t => t.square
    ? `<rect x="${MX(t.x) - t.r * 3.8}" y="${MY(t.z) - t.r * 5.6}" width="${t.r * 7.6}" height="${t.r * 11.2}" rx=".8" fill="#2c2324"/><text x="${MX(t.x)}" y="${MY(t.z) + 1}" text-anchor="middle" font-size="2.4" fill="#9a8f89" font-family="IBM Plex Mono,monospace">${t.t}</text>`
    : `<ellipse cx="${MX(t.x)}" cy="${MY(t.z)}" rx="${t.r * 3.8}" ry="${t.r * 5.6}" fill="#2c2324"/><text x="${MX(t.x)}" y="${MY(t.z) + 0.9}" text-anchor="middle" font-size="2.2" fill="#9a8f89" font-family="IBM Plex Mono,monospace">${t.t}</text>`).join('')}`;

const SKIES = {
  lunch: { top: '#4f8fd0', mid: '#9cc7ea', hor: '#e3eef5', sea: 0x2f6f95, sun: [0.25, 0.75, -1], sunCol: '#fffdf2', glow: 0, win: 0.0, hemi: 0.9, inside: 0.35 },
  sunset: { top: '#2d3566', mid: '#c46a5a', hor: '#ffbf6a', sea: 0x3a3a5a, sun: [0.15, 0.035, -1], sunCol: '#ffd27a', glow: 1, win: 0.35, hemi: 0.55, inside: 0.75 },
  night: { top: '#05070f', mid: '#0e1630', hor: '#26304a', sea: 0x070b16, sun: [-0.4, 0.3, -1], sunCol: '#e8ecff', glow: 0.2, win: 1, hemi: 0.18, inside: 1.0 },
};

SeatView({
  title: 'Aster Rooftop', subtitle: '32nd floor · Harbour Tower · Sat 15 Nov',
  optionsLabel: 'Table time', defaultOption: 1,
  options: [
    { label: '13:00', tag: 'LUNCH', sky: 'lunch', seed: 4 },
    { label: '19:30', tag: 'SUNSET', sky: 'sunset', seed: 12 },
    { label: '21:30', tag: 'NIGHT', sky: 'night', seed: 19 },
  ],
  tiers: { std: 'Room seat', prem: 'Window table' },
  seats,
  takenProb: s => s.tier === 'prem' ? 0.4 : 0.3,
  price: s => s.tier === 'prem' ? 30 : s.y > 0 ? 20 : 15,
  bookVerb: 'Reserve',
  hint: 'Tap a seat to see what you look at from it. The deposit comes off your bill.',
  map: { aspect: 100 / 78, seat: 3.4, decor, miniDecor: '<rect x="2" y="6" width="96" height="3" fill="#9ec6e0"/>' },
  chair: { color: 0x2f4a3a, prem: 0x7a5236, backH: 0.52, w: 0.44, arms: false, seatH: 0.46, backTilt: -0.08, premScale: 1 },
  people: [0x2a2224, 0x1e2430, 0x3a2b26, 0xd8d2c8, 0x24302a],
  fovPortrait: 98, fovWide: 80,
  look: { yaw: 1.4, pitch: 0.35 },
  overview: { pos: [0, 4.5, 15], look: [0, 1, -6] },
  pose: s => {
    const fx = -Math.sin(s.rot), fz = -Math.cos(s.rot);
    const ex = s.x - fx * 0.25, ez = s.z - fz * 0.25, ey = s.y + 1.22;
    return { pos: [ex, ey, ez], look: [ex + fx * 8, ey - 0.55, ez + fz * 8] };
  },
  metrics(s) {
    const facing = Math.cos(s.rot); // 1 = toward the glass
    const where = facing > 0.7 ? 'ahead' : facing < -0.7 ? 'behind you' : 'to your side';
    let verdict, note;
    if (facing > 0.7 && s.tier === 'prem') { verdict = 'Front-row view'; note = 'Nothing between you and the glass. At sunset the sun goes down straight ahead of you.'; }
    else if (facing > 0.7 && s.y > 0) { verdict = 'Over the room'; note = 'The platform lifts you 45 cm, so you see the horizon over the heads at the front tables.'; }
    else if (facing > 0.7) { verdict = 'View over the tables'; note = 'You face the glass across the window tables. Guests in front of you sit in the lower part of the view.'; }
    else if (facing < -0.7) { verdict = 'Back to the view'; note = 'Your guest gets the view and you see the room. Choose the seat opposite if the view matters to you.'; }
    else { verdict = 'Side-on view'; note = 'Turn your head for the sea. A good seat for a group, since everyone shares the view.'; }
    return { verdict, note, stats: [[s.z.toFixed(1) + ' m', 'to the glass'], [where, 'the view is'], ['for ' + s.size, 'table size']] };
  },
  ticket: (s, o) => ({ eyebrow: 'Reserved', title: 'Aster Rooftop', when: `Sat 15 Nov · ${o.label} · Table ${s.t}`, fields: [['Table', s.t], ['Seat', s.short.slice(-1)]] }),
  codePrefix: 'AR',
  doneNote: 'Your seat now shows as yours on the floor plan. Give this code to the host when you arrive.',
  build(L, o) {
    const { T, scene, box, mat, basic } = L;
    const hemi = new T.HemisphereLight(0xffffff, 0x2a2018, 0.6); scene.add(hemi);
    const warm = [];
    [[-6, 4], [0, 4], [6, 4], [0, 9]].forEach(([x, z]) => { const p = new T.PointLight(0xffc887, 0.7, 12, 2); p.position.set(x, 2.6, z); scene.add(p); warm.push(p); });
    const sunL = new T.DirectionalLight(0xffffff, 0.6); scene.add(sunL);

    // room
    const wood = L.canvasTex(512, 512, (g) => { for (let i = 0; i < 16; i++) { g.fillStyle = ['#5a3c28', '#634330', '#4f3523', '#6a4834'][i % 4]; g.fillRect(0, i * 32, 512, 31); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(((i * 197) % 512), i * 32, 2, 32); } });
    wood.wrapS = wood.wrapT = T.RepeatWrapping; wood.repeat.set(6, 4);
    const floor = new T.Mesh(new T.PlaneGeometry(24, 14), new T.MeshStandardMaterial({ map: wood, roughness: 0.7 })); floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 6); scene.add(floor);
    box(20, RAISE, 4, mat(0x3f2a1e), 0, RAISE / 2, 10.2);
    box(24, 0.1, 14, mat(0x1b1513), 0, 3.4, 6);
    box(24, 3.4, 0.2, mat(0x2b211d), 0, 1.7, 13);
    box(0.2, 3.4, 14, mat(0x2b211d), -12, 1.7, 6); box(0.2, 3.4, 14, mat(0x2b211d), 12, 1.7, 6);
    box(20, 0.9, 0.5, mat(0x5a3a2a), 0, RAISE + 0.45, 11.9); // banquette back
    // glass wall: mullions + sill + faint glass
    const frame = mat(0x15110f, { roughness: 0.5 });
    for (let x = -11.25; x <= 11.26; x += 4.5) box(0.09, 3.4, 0.12, frame, x, 1.7, 0);
    box(24, 0.25, 0.3, frame, 0, 0.12, 0); box(24, 0.15, 0.2, frame, 0, 3.33, 0);
    const glass = new T.Mesh(new T.PlaneGeometry(24, 3.3), new T.MeshBasicMaterial({ color: 0xbfd8ff, transparent: true, opacity: 0.05, depthWrite: false })); glass.position.set(0, 1.7, -0.01); scene.add(glass);
    // tables, cloths, candles, pendants
    const cloth = mat(0xf1ece2, { roughness: 0.95 }), candle = basic(0xffc56b), metal = mat(0x2a2522, { metalness: .5, roughness: .4 });
    tables.forEach(t => {
      const top = t.square ? new T.Mesh(new T.BoxGeometry(t.r * 2, 0.06, t.r * 2), cloth) : new T.Mesh(new T.CylinderGeometry(t.r, t.r, 0.06, 28), cloth);
      top.position.set(t.x, t.y + 0.75, t.z); scene.add(top);
      const leg = new T.Mesh(new T.CylinderGeometry(0.05, 0.25, 0.72, 10), metal); leg.position.set(t.x, t.y + 0.36, t.z); scene.add(leg);
      box(0.05, 0.09, 0.05, candle, t.x, t.y + 0.83, t.z);
      const glassM = new T.MeshStandardMaterial({ color: 0xdfe8ff, transparent: true, opacity: 0.35, roughness: 0.1 });
      [[-0.18, 0.12], [0.18, -0.12]].forEach(([dx, dz]) => { const g = new T.Mesh(new T.CylinderGeometry(0.035, 0.03, 0.14, 10), glassM); g.position.set(t.x + dx, t.y + 0.85, t.z + dz); scene.add(g); });
      const pend = new T.Mesh(new T.SphereGeometry(0.14, 14, 10), basic(0xffd9a0)); pend.position.set(t.x, 2.55, t.z); scene.add(pend);
      box(0.01, 0.8, 0.01, metal, t.x, 2.98, t.z);
    });
    // outside: sky dome, sea, sun, skyline
    let skyTex = null;
    const sky = new T.Mesh(new T.SphereGeometry(900, 32, 16), new T.MeshBasicMaterial({ side: T.BackSide, fog: false }));
    scene.add(sky);
    const sea = new T.Mesh(new T.PlaneGeometry(4000, 4000), new T.MeshStandardMaterial({ color: 0x2f6f95, roughness: 0.35, metalness: 0.2 }));
    sea.rotation.x = -Math.PI / 2; sea.position.y = -FLOOR_H; scene.add(sea);
    const sunDisc = new T.Mesh(new T.CircleGeometry(16, 32), new T.MeshBasicMaterial({ color: 0xffd27a, fog: false })); scene.add(sunDisc);
    const glitter = new T.Mesh(new T.PlaneGeometry(60, 700), new T.MeshBasicMaterial({ color: 0xffb35c, transparent: true, opacity: 0.0, blending: T.AdditiveBlending, depthWrite: false, fog: false }));
    glitter.rotation.x = -Math.PI / 2; scene.add(glitter);
    const winTex = L.canvasTex(64, 128, (g) => { g.fillStyle = '#000'; g.fillRect(0, 0, 64, 128); for (let y = 4; y < 128; y += 8) for (let x = 4; x < 64; x += 10) if ((x * 7 + y * 13) % 5 > 1) { g.fillStyle = ['#ffd58a', '#fff1c9', '#ffc46b'][(x + y) % 3]; g.fillRect(x, y, 5, 4); } });
    winTex.wrapS = winTex.wrapT = T.RepeatWrapping; winTex.repeat.set(2, 4);
    const bMat = new T.MeshStandardMaterial({ color: 0x2a3140, emissive: 0xffffff, emissiveMap: winTex, emissiveIntensity: 0, roughness: 0.8 });
    const rr = L.rng(77), NB = 140, blds = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), bMat, NB), D = new T.Object3D();
    for (let i = 0; i < NB; i++) {
      const side = i % 2 ? 1 : -1, far = 220 + rr() * 520, x = side * (90 + rr() * 380) + (far > 500 ? side * 120 : 0);
      const h = 20 + Math.pow(rr(), 2) * 180, w = 14 + rr() * 26;
      D.position.set(x, -FLOOR_H + h / 2, -far); D.scale.set(w, h, w); D.rotation.set(0, rr() * 0.5, 0); D.updateMatrix(); blds.setMatrixAt(i, D.matrix);
    }
    scene.add(blds);
    // far headland
    let curSky = o.sky;
    function setSky(no) {
      curSky = no.sky;
      const k = SKIES[no.sky];
      skyTex = L.canvasTex(16, 512, (g) => { const gr = g.createLinearGradient(0, 0, 0, 512); gr.addColorStop(0, k.top); gr.addColorStop(0.38, k.mid); gr.addColorStop(0.5, k.hor); gr.addColorStop(0.52, k.hor); gr.addColorStop(1, '#0b0e14'); g.fillStyle = gr; g.fillRect(0, 0, 16, 512); });
      sky.material.map = skyTex; sky.material.needsUpdate = true;
      sea.material.color.setHex(k.sea);
      const dir = new T.Vector3(...k.sun).normalize();
      sunDisc.position.copy(dir.clone().multiplyScalar(800)); sunDisc.lookAt(0, 0, 0); sunDisc.material.color.set(k.sunCol);
      sunDisc.scale.setScalar(no.sky === 'night' ? 0.55 : 1);
      sunL.position.copy(dir.clone().multiplyScalar(50)); sunL.intensity = no.sky === 'night' ? 0.05 : 0.7; sunL.color.set(k.sunCol);
      glitter.material.opacity = k.glow * 0.22; glitter.material.color.set(no.sky === 'night' ? '#9fb2ff' : '#ffb35c');
      glitter.position.set(dir.x * 350, -FLOOR_H + 0.5, -380);
      bMat.emissiveIntensity = k.win; bMat.color.setHex(no.sky === 'lunch' ? 0x8b97a8 : 0x2a3140);
      hemi.intensity = k.hemi; warm.forEach(p => p.intensity = 0.4 + k.inside * 0.6);
      scene.background = new T.Color(k.hor);
    }
    setSky(o);
    return { setOption: setSky, tick(t) { glitter.material.opacity = SKIES[curSky].glow * (0.18 + Math.sin(t * 1.7) * 0.05); } };
  },
});
})();
</script>
</body>
</html>
