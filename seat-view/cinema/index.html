<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seat View · Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../shared/style.css">
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../shared/engine.js"></script>
<script>
(() => {
const ROWS = 'ABCDEFGHI';
const colX = c => { let x = (c - 7) * 0.62; if (c <= 2) x -= 0.6; if (c >= 12) x += 0.6; return x; };
const rowZ = r => 4.8 + r * 1.12 + (r >= 7 ? (r - 6) * 0.45 : 0);
const rowY = r => r * 0.4;
const BOTTOM = 1.1;
const MX = x => 50 + x * 8.2, MY = r => 18 + r * 7.4;

const seats = [];
for (let r = 0; r < 9; r++) for (let c = 0; c < 15; c++) seats.push({
  r, c, tier: r >= 7 ? 'prem' : 'std',
  name: `Row ${ROWS[r]}, Seat ${c + 1}`, short: ROWS[r] + (c + 1),
  x: colX(c), y: rowY(r), z: rowZ(r), rot: 0, mx: MX(colX(c)), my: MY(r),
});
let rowLabels = '';
for (let r = 0; r < 9; r++) rowLabels += `<text x="1.5" y="${MY(r) + 1.2}" font-size="3" fill="#9a8f89" font-family="IBM Plex Mono,monospace">${ROWS[r]}</text><text x="96" y="${MY(r) + 1.2}" font-size="3" fill="#9a8f89" font-family="IBM Plex Mono,monospace">${ROWS[r]}</text>`;

SeatView({
  title: 'Dune Walker', subtitle: 'Kino Vela · Hall 3 · Fri 14 Nov',
  optionsLabel: 'Showtime', defaultOption: 1,
  options: [
    { label: '17:30', tag: '2D', W: 12.5, H: 5.3, std: 12.5, prem: 16, seed: 11 },
    { label: '19:45', tag: 'IMAX', W: 17, H: 8.6, std: 15.5, prem: 19, seed: 27 },
    { label: '22:15', tag: '2D', W: 12.5, H: 5.3, std: 12.5, prem: 16, seed: 53 },
  ],
  tiers: { std: 'Standard', prem: 'Recliner' },
  seats,
  takenProb: s => 0.12 + 0.38 * (1 - Math.abs(s.c - 7) / 9) * (1 - Math.abs(s.r - 5) / 6),
  price: (s, o) => s.tier === 'prem' ? o.prem : o.std,
  map: {
    aspect: 100 / 82, seat: 4.4,
    decor: `<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#f4ede5" stop-opacity="0"/><stop offset=".5" stop-color="#f4ede5"/><stop offset="1" stop-color="#f4ede5" stop-opacity="0"/></linearGradient></defs>
      <path d="M6 8 Q50 0 94 8" fill="none" stroke="url(#sg)" stroke-width=".8"/>
      <text x="50" y="11" text-anchor="middle" font-size="2.4" letter-spacing="1.2" fill="#9a8f89" font-family="IBM Plex Mono,monospace">SCREEN</text>${rowLabels}`,
    miniDecor: '<rect x="10" y="4" width="80" height="2" rx="1" fill="#9a8f89"/>',
  },
  chair: { color: 0x7a141c, prem: 0x601017 },
  overview: { pos: [0, 8.5, 18], look: [0, 3, 0] },
  approach: s => ({ pos: [s.x * 0.4, 8.5, 18], look: [0, 3, 0] }),
  pose: (s, o) => ({ pos: [s.x, s.y + 1.28, s.z + 0.3], look: [s.x * 0.15, BOTTOM + o.H * 0.45, 0] }),
  metrics(s, o) {
    const z = s.z + 0.15, eyeY = s.y + 1.15, cy = BOTTOM + o.H / 2;
    const dist = Math.hypot(s.x, z, cy - eyeY);
    const ang = (Math.atan((o.W / 2 - s.x) / z) + Math.atan((o.W / 2 + s.x) / z)) * 180 / Math.PI;
    let verdict, note;
    if (ang >= 74) { verdict = 'Up close'; note = 'The screen fills your vision. Expect to turn your head for the edges.'; }
    else if (Math.abs(s.x) > 2.8) { verdict = 'Off to the side'; note = 'You see the screen at an angle, so the far side looks narrower.'; }
    else if (ang >= 44) { verdict = 'Sweet spot'; note = 'Fills most of your view without head-turning, close to the centre line.'; }
    else { verdict = 'Full picture'; note = 'The whole frame sits comfortably in view, but it feels smaller.'; }
    if (o.tag === 'IMAX' && verdict === 'Up close') note += ' On IMAX the top of the frame is high above you.';
    const off = Math.abs(s.x);
    return { verdict, note, stats: [
      [dist.toFixed(1) + ' m', 'to screen'],
      [Math.round(ang) + '°', 'of your view'],
      [off < 0.05 ? '0.0 m' : off.toFixed(1) + ' m', off < 0.05 ? 'dead centre' : s.x < 0 ? 'left of centre' : 'right of centre'],
    ] };
  },
  ticket: (s, o) => ({ title: 'Dune Walker', when: `Fri 14 Nov · ${o.label} ${o.tag} · Hall 3`, fields: [['Row', ROWS[s.r]], ['Seat', s.c + 1]] }),
  codePrefix: 'KV',
  build(L, o) {
    const { T, scene, box, mat } = L;
    scene.background = new T.Color(0x050304);
    scene.fog = new T.Fog(0x050304, 14, 42);
    scene.add(new T.HemisphereLight(0xfff1dc, 0x1a0b0b, 0.32));
    const glow = new T.PointLight(0xffe2b8, 0.9, 30, 1.8); scene.add(glow);
    const fill = new T.DirectionalLight(0xffd9b0, 0.35); fill.position.set(0, 6, -2); scene.add(fill);

    const film = L.canvasTex(1600, 760, (g) => {
      const sky = g.createLinearGradient(0, 0, 0, 760);
      sky.addColorStop(0, '#c9b193'); sky.addColorStop(.55, '#eedcc1'); sky.addColorStop(1, '#e9cfa8');
      g.fillStyle = sky; g.fillRect(0, 0, 1600, 760);
      const sun = g.createRadialGradient(1120, 300, 10, 1120, 300, 520);
      sun.addColorStop(0, 'rgba(255,248,232,.9)'); sun.addColorStop(1, 'rgba(255,248,232,0)');
      g.fillStyle = sun; g.fillRect(0, 0, 1600, 760);
      const layers = [[430, 26, .004, 1.2, '#e4c49a', '#cfa776'], [480, 38, .0032, 2.5, '#ddb684', '#bf935f'], [560, 52, .0024, .4, '#d6a971', '#a97947'], [660, 70, .0018, 3.3, '#c9955b', '#8d5f33']];
      let ridge;
      layers.forEach(([y0, a, f, p, top, bot], i) => {
        const pts = [];
        g.beginPath(); g.moveTo(0, 760);
        for (let x = 0; x <= 1600; x += 8) { const y = y0 - a * Math.sin(x * f + p) - a * .45 * Math.sin(x * f * 2.3 + p * 1.7); pts.push([x, y]); g.lineTo(x, y); }
        g.lineTo(1600, 760); g.closePath();
        const gr = g.createLinearGradient(0, y0 - a, 0, 760); gr.addColorStop(0, top); gr.addColorStop(1, bot);
        g.fillStyle = gr; g.fill();
        g.strokeStyle = 'rgba(255,244,222,.35)'; g.lineWidth = 2; g.beginPath(); pts.forEach(([x, y], j) => j ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
        if (i === 1) ridge = pts;
      });
      const [fx, fy] = ridge.reduce((m, p) => p[1] < m[1] && p[0] > 600 && p[0] < 1000 ? p : m, [800, 999]);
      g.fillStyle = '#2b1d12'; g.fillRect(fx - 2, fy - 22, 5, 18); g.beginPath(); g.arc(fx + .5, fy - 25, 3.4, 0, 7); g.fill();
    });

    let group = null;
    function screen(o) {
      if (group) scene.remove(group);
      group = new T.Group();
      const geo = new T.PlaneGeometry(o.W, o.H, 40, 1), pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) { const x = pos.getX(i); pos.setZ(i, 0.011 * x * x); }
      const tex = film.clone(); tex.needsUpdate = true;
      const imgA = 1600 / 760, a = o.W / o.H;
      if (a < imgA) { tex.repeat.set(a / imgA, 1); tex.offset.set((1 - a / imgA) / 2, 0); } else { tex.repeat.set(1, imgA / a); tex.offset.set(0, (1 - imgA / a) / 2); }
      const scr = new T.Mesh(geo, new T.MeshBasicMaterial({ map: tex, toneMapped: false }));
      scr.position.set(0, BOTTOM + o.H / 2, 0); group.add(scr);
      const mask = new T.Mesh(new T.PlaneGeometry(o.W + 1.2, o.H + 1.2), new T.MeshBasicMaterial({ color: 0x020101 }));
      mask.position.set(0, BOTTOM + o.H / 2, -0.05); group.add(mask);
      scene.add(group);
      glow.position.set(0, BOTTOM + o.H / 2, 2.5);
    }
    screen(o);

    const W = 21, backZ = rowZ(8) + 2.8, H = 12;
    const dark = mat(0x140d0e), carpet = mat(0x1d1113);
    box(W, 0.1, backZ + 1, carpet, 0, -0.05, backZ / 2 - 0.5);
    for (let r = 1; r < 9; r++) {
      const zf = (rowZ(r - 1) + rowZ(r)) / 2 + 0.1, zb = r === 8 ? backZ : (rowZ(r) + rowZ(r + 1)) / 2 + 0.1;
      box(W, rowY(r), zb - zf, carpet, 0, rowY(r) / 2, (zf + zb) / 2);
    }
    box(0.2, H, backZ + 1, dark, -W / 2, H / 2, backZ / 2 - 0.5);
    box(0.2, H, backZ + 1, dark, W / 2, H / 2, backZ / 2 - 0.5);
    box(W, H, 0.2, dark, 0, H / 2, backZ);
    box(W, 0.2, backZ + 1, dark, 0, H, backZ / 2 - 0.5);
    box(W, H, 0.2, mat(0x0a0607), 0, H / 2, -0.4);
    const step = new T.MeshBasicMaterial({ color: 0xffb35c });
    for (let r = 0; r < 9; r++) for (const ax of [(colX(2) + colX(3)) / 2, (colX(11) + colX(12)) / 2]) box(0.18, 0.025, 0.04, step, ax, rowY(r) + 0.02, rowZ(r) - 0.4);
    return { setOption: screen };
  },
});
})();
</script>
</body>
</html>
