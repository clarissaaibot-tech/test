<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D dollhouse on the left, service-manual panel on the right (bottom sheet on phones). */
:root{
  --bg:#e7ebee; --surface:#fbfcfc; --ink:#17202a; --muted:#56616d; --line:#d3d9de;
  --accent:#1f56e0; --accent-soft:#e3eafc; --led:#ef9d10; --ok:#1d8a5a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151a; --surface:#181e25; --ink:#e7ecf1; --muted:#9aa5b0; --line:#2a333d;
  --accent:#7aa2ff; --accent-soft:#1d2a47; --led:#f5b43a; --ok:#4cc28c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151a; --surface:#181e25; --ink:#e7ecf1; --muted:#9aa5b0; --line:#2a333d;
  --accent:#7aa2ff; --accent-soft:#1d2a47; --led:#f5b43a; --ok:#4cc28c; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px}
.stage{position:relative;min-width:0;overflow:hidden}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene.hovering{cursor:pointer}
.top{position:absolute;left:0;right:0;top:0;padding:14px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.chip{font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:focus-visible,.row:focus-visible,.pin:focus-visible,.back:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);pointer-events:none}

#pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;transform:translate(-50%,-100%);background:none;border:0;padding:0;cursor:pointer;font:500 12px var(--f-body);color:var(--ink)}
.pin .dot{width:22px;height:22px;border-radius:50%;background:var(--led);color:#1d1400;display:grid;place-items:center;font:600 11px var(--f-mono);box-shadow:0 0 0 3px color-mix(in srgb,var(--led) 30%,transparent);transition:transform .15s}
.pin .tag{display:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.pin:hover .tag,.pin.on .tag{display:block}
.pin:hover .dot{transform:scale(1.15)}
.pin.on .dot{background:var(--accent);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 35%,transparent)}
.pin.dim{opacity:.28}

.panel{background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.pad{padding:20px 22px 28px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel h2{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;text-wrap:balance}
.lede{margin:0;color:var(--muted)}
.search{width:100%;font:15px var(--f-body);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.group{display:flex;flex-direction:column;gap:2px}
.group h3{margin:0 0 4px;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:8px;padding:8px 6px;cursor:pointer;color:var(--ink);font:inherit}
.row:hover{background:var(--accent-soft)}
.row .n{font:600 11px var(--f-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--led) 25%,transparent);color:var(--ink)}
.row .s{font-size:12.5px;color:var(--muted)}
.row .go{color:var(--muted);font-family:var(--f-mono)}
.empty{color:var(--muted);font-size:14px}

.back{align-self:flex-start;background:none;border:0;color:var(--accent);font:500 14px var(--f-body);cursor:pointer;padding:0}
.model{display:flex;flex-direction:column;gap:4px}
.model label{font:500 12px var(--f-mono);color:var(--muted)}
.model input{font:14px var(--f-mono);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
section.block{display:flex;flex-direction:column;gap:10px}
section.block h4{margin:0;font-family:var(--f-display);font-weight:500;font-size:17px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
ol.steps li{counter-increment:s}
ol.steps label{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
ol.steps input{position:absolute;opacity:0;pointer-events:none}
ol.steps .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px var(--f-mono);color:var(--muted)}
ol.steps .box::before{content:counter(s)}
ol.steps input:checked + .box{background:var(--ok);border-color:var(--ok);color:#fff}
ol.steps input:checked + .box::before{content:"\2713"}
ol.steps input:checked ~ span{color:var(--muted);text-decoration:line-through}
ol.steps input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.progress{font:12px var(--f-mono);color:var(--muted)}
details{border-top:1px solid var(--line);padding:9px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:500}
details p{margin:6px 0 0;color:var(--muted)}
.pro{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:14px}
.pro strong{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.link{color:var(--accent);font-weight:500}

@media (max-width: 820px){
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .pad{padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  .hint{display:none}
  .brand h1{font-size:19px}
}
@media (prefers-reduced-motion: reduce){.pin .dot{transition:none}}
</style>

  <div class="stage">
    <canvas id="scene" aria-label="3D map of the apartment. Click an appliance to open its help."></canvas>
    <div id="pins"></div>

      <div class="brand"><h1>Home Fix Map</h1><span id="count"></span></div>
      <div class="chips" id="chips" role="group" aria-label="Rooms"></div>

    <div class="hint">Drag to look around · walls in the way fade out · tap a dot</div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

const APPLIANCES = [
  { id:'ac', name:'Samsung air conditioner', room:'vanity', pos:[1.05,2.02,4.03], size:[1.0,0.3,0.24], color:'#f4f4f2',

  { id:'remote', name:'AC remote', room:'desk', pos:[3.0,0.75,2.42], size:[0.06,0.025,0.17], color:'#f2f2f0',

  { id:'dryer', name:'Dyson hair dryer', room:'vanity', pos:[0.3,0.78,3.85], size:[0.1,0.26,0.1], shape:'cyl', color:'#4a3b6e',

/* The layout above was measured as a floor plan seen from above (x = east).
   Three.js shows +x on the left when you walk in facing +z, so mirror x once here. */
(function mirrorX(){
  const W = HOME.size[0];
  HOME.rooms.forEach(r=>{ const [x1,z1,x2,z2]=r.rect; r.rect=[W-x2,z1,W-x1,z2]; });
  HOME.walls = HOME.walls.map(([x1,z1,x2,z2,h,nx,nz])=>[W-x1,z1,W-x2,z2,h,-nx,nz]);
  HOME.decor.forEach(d=>d[0]=W-d[0]);
  HOME.furniture.forEach(f=>f[0]=W-f[0]);
  APPLIANCES.forEach(a=>a.pos[0]=W-a.pos[0]);
})();
/* ---------- STATE ---------- */

  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};
let roomFilter = 'all';
let selectedId = null;
let query = '';
const roomById = Object.fromEntries(HOME.rooms.map(r=>[r.id,r]));
APPLIANCES.forEach((a,i)=>a.n=i+1);

/* ---------- THREE SETUP ---------- */
const canvas = document.getElementById('scene');
const stage = canvas.parentElement;
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.47;
controls.minDistance = 0.8;
controls.maxDistance = 14;

const house = new THREE.Group();
house.position.set(-HOME.size[0]/2, 0, -HOME.size[1]/2);
scene.add(house);

const hemi = new THREE.HemisphereLight(0xfff6e8, 0x8a8f96, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.5);
sun.position.set(3, 9, -2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});
sun.shadow.bias = -0.0005;
scene.add(sun);

const PALETTE = {
  light:{ bg:'#e7ebee', floor:'#cfae86', wall:'#f2ead3', rattan:'#c9a46e', steel:'#7f868d', wardrobe:'#e8e5df',
          stool:'#6c7277', desk:'#3b2b23', chair:'#262626', plant:'#3f7a4a' },
  dark: { bg:'#10151a', floor:'#6e5a45', wall:'#6a6555', rattan:'#8f7650', steel:'#535a61', wardrobe:'#8c8984',
          stool:'#474c51', desk:'#2b201b', chair:'#1b1b1b', plant:'#2f5d38' },
};
const mats = {};
const mat = role => mats[role] ||= new THREE.MeshStandardMaterial({ roughness:0.85, metalness:0 });
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if (t) return t==='dark';
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const p = PALETTE[isDark()?'dark':'light'];
  scene.background = new THREE.Color(p.bg);
  for (const k in mats) if (p[k]) mats[k].color.set(p[k]);
  for (const w of wallObjs) w.mesh.material.color.set(p.wall);
  hemi.intensity = isDark()?0.75:1.1;
}

function box(w,h,d,material,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), material);
  m.position.set(x, y+h/2, z);
  m.castShadow = m.receiveShadow = true;
  house.add(m); return m;
}

// floor slab per zone
for (const r of HOME.rooms){
  const [x1,z1,x2,z2] = r.rect;
  box(x2-x1, 0.12, z2-z1, mat('floor'), (x1+x2)/2, -0.12, (z1+z2)/2).castShadow = false;
}
// walls: each gets its own material so it can fade when it blocks the view
const T = 0.1;
const wallObjs = [];
for (const [x1,z1,x2,z2,h,nx,nz] of HOME.walls){
  const len = Math.hypot(x2-x1, z2-z1), horiz = z1===z2;
  const m = new THREE.MeshStandardMaterial({ roughness:0.95, transparent:true, opacity:1 });
  const mesh = box(horiz?len+T:T, h, horiz?T:len+T, m, (x1+x2)/2, 0, (z1+z2)/2);
  mesh.castShadow = false;
  wallObjs.push({ mesh, out:new THREE.Vector2(nx,nz), decor:[], op:1 });
}
for (const [x,y,z,w,h,d,color,wi] of HOME.decor){
  const m = box(w,h,d,new THREE.MeshStandardMaterial({ color, roughness:0.7, transparent:true }),x,y,z);
  m.castShadow = false;
  wallObjs[wi].decor.push(m);
}
for (const [x,y,z,w,h,d,role] of HOME.furniture) box(w,h,d,mat(role),x,y,z);

// appliances
const pickables = [];
for (const a of APPLIANCES){
  const m = new THREE.MeshStandardMaterial({ color:a.color, roughness:0.45, metalness:0.15, emissive:0x000000 });
  const [w,h,d] = a.size;
  let mesh;
  if (a.shape==='cyl'){
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(w/2, w/2, h, 32), m);
    mesh.position.set(a.pos[0], a.pos[1]+h/2, a.pos[2]);
    mesh.castShadow = mesh.receiveShadow = true; house.add(mesh);
  } else mesh = box(w,h,d,m,...a.pos);
  mesh.userData.id = a.id;
  a.mesh = mesh;
  a.world = new THREE.Vector3();
  pickables.push(mesh);
}
house.updateMatrixWorld(true);
for (const a of APPLIANCES){
  a.mesh.getWorldPosition(a.world);
  a.pinAt = a.world.clone().add(new THREE.Vector3(0, a.size[1]/2 + 0.08, 0));
}

applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

// fade walls that sit between the camera and the room
const camFlat = new THREE.Vector2();
function fadeWalls(){
  camFlat.set(camera.position.x - controls.target.x, camera.position.z - controls.target.z).normalize();
  for (const w of wallObjs){
    const goal = w.out.dot(camFlat) > 0.25 ? 0.08 : 1;
    w.op += (goal - w.op) * (reduceMotion ? 1 : 0.15);
    for (const m of [w.mesh, ...w.decor]){
      m.material.opacity = w.op;
      m.material.depthWrite = w.op > 0.5;
      m.visible = w.op > 0.02;
    }
  }
}

/* ---------- CAMERA ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOME_VIEW = { pos:new THREE.Vector3(-3.9, 7.4, -5.9), target:new THREE.Vector3(0,1.35,0.1) };
let tween = null;
function flyTo(pos, target){
  if (reduceMotion){ camera.position.copy(pos); controls.target.copy(target); return; }
  tween = { p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:target, start:performance.now(), dur:750 };
}
function roomCenter(id){
  const [x1,z1,x2,z2] = roomById[id].rect;
  return new THREE.Vector3((x1+x2)/2 - HOME.size[0]/2, 0.5, (z1+z2)/2 - HOME.size[1]/2);
}
function viewRoom(id){
  if (id==='all') return flyTo(HOME_VIEW.pos.clone(), HOME_VIEW.target.clone());
  const [x1,z1,x2,z2] = roomById[id].rect;
  const s = Math.max(x2-x1, z2-z1) + 1.2;
  const c = roomCenter(id);
  flyTo(c.clone().add(new THREE.Vector3(-s*0.55, s*1.25, -s*0.95)), c);
}
function viewAppliance(a){
  const c = new THREE.Vector3(0, a.world.y, 0); // room centre at the appliance's height
  const dir = new THREE.Vector3(c.x - a.world.x, 0, c.z - a.world.z);
  if (dir.lengthSq() < 0.01) dir.set(0,0,-1);
  dir.normalize();
  const dist = 1.1 + Math.max(...a.size)*1.6;
  flyTo(a.world.clone().add(dir.multiplyScalar(dist)).add(new THREE.Vector3(0, 0.9, 0)), a.world.clone());
}
camera.position.copy(HOME_VIEW.pos);
controls.target.copy(HOME_VIEW.target);

function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  // pull back on narrow screens so the whole flat fits
  camera.fov = w/h < 1 ? 55 : 40;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- PINS ---------- */
const pinLayer = document.getElementById('pins');
for (const a of APPLIANCES){
  const b = document.createElement('button');
  b.className = 'pin';
  b.innerHTML = `<span class="dot">${a.n}</span><span class="tag">${a.name}</span>`;
  b.setAttribute('aria-label', `${a.name}, ${roomById[a.room].name}`);
  b.addEventListener('click', e=>{ e.stopPropagation(); select(a.id); });
  pinLayer.appendChild(b);
  a.pin = b;
}
const v = new THREE.Vector3();
function placePins(){
  const w = stage.clientWidth, h = stage.clientHeight;
  for (const a of APPLIANCES){
    v.copy(a.pinAt).project(camera);
    const hidden = v.z > 1;
    a.pin.hidden = hidden;
    if (!hidden) a.pin.style.transform = `translate(${(v.x*.5+.5)*w}px, ${(-v.y*.5+.5)*h}px) translate(-11px,-100%)`;
  }
}
function refreshPins(){
  for (const a of APPLIANCES){
    a.pin.classList.toggle('on', a.id===selectedId);
    a.pin.classList.toggle('dim', roomFilter!=='all' && a.room!==roomFilter && a.id!==selectedId);
    const on = a.id===selectedId, hov = a.id===hoverId;
    a.mesh.material.emissive.set(on ? (isDark()?0x2a4aa8:0x1f56e0) : hov ? 0x444444 : 0x000000);
    a.mesh.material.emissiveIntensity = on ? 0.28 : 0.3;
  }
}

/* ---------- PICKING ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let hoverId = null, downAt = null;
function hit(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables)[0];
  return h ? h.object.userData.id : null;
}
canvas.addEventListener('pointermove', e=>{
  if (e.pointerType!=='mouse') return;
  const id = hit(e);
  if (id!==hoverId){ hoverId=id; canvas.classList.toggle('hovering', !!id); refreshPins(); }
});
canvas.addEventListener('pointerdown', e=>{ downAt=[e.clientX,e.clientY]; tween=null; });
canvas.addEventListener('pointerup', e=>{
  if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 6) return;
  const id = hit(e);
  if (id) select(id);
});

/* ---------- PANEL ---------- */
const panel = document.getElementById('panel');
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('count').textContent = `${APPLIANCES.length} things mapped · 1 room so far`;

const chips = document.getElementById('chips');
function renderChips(){
  chips.innerHTML = '';
  for (const r of [{id:'all',name:'Whole room'}, ...HOME.rooms]){
    const b = document.createElement('button');
    b.className='chip'; b.textContent=r.name;
    b.setAttribute('aria-pressed', String(roomFilter===r.id));
    b.onclick = ()=>{ roomFilter=r.id; selectedId=null; setHash(''); renderChips(); renderList(); refreshPins(); viewRoom(r.id); };
    chips.appendChild(b);
  }
}

function renderList(){
  const q = query.trim().toLowerCase();
  const rooms = HOME.rooms.filter(r=>roomFilter==='all'||r.id===roomFilter);
  let groups = '';
  for (const r of rooms){
    const items = APPLIANCES.filter(a=>a.room===r.id && (!q || (a.name+' '+a.summary).toLowerCase().includes(q)));
    if (!items.length) continue;
    groups += `<div class="group"><h3><span>${r.name}</span><span>${items.length}</span></h3>` +
      items.map(a=>`<button class="row" data-id="${a.id}"><span class="n">${a.n}</span><span><div>${esc(a.name)}</div><div class="s">${esc(modelOf(a) || a.steps.length+' checks')}</div></span><span class="go">›</span></button>`).join('') + `</div>`;
  }
  panel.innerHTML = `<div class="pad">
    <div><div class="eyebrow">${esc(HOME.name)}</div>
    <h2>What stopped working?</h2></div>
    <p class="lede">Tap anything with a dot in the 3D room, or pick it below. Each one opens the checks to try first, the common faults, and when to call someone.</p>
    <input class="search" id="q" type="search" placeholder="Search appliances, e.g. no sound" value="${esc(query)}" aria-label="Search appliances">
    ${groups || '<p class="empty">Nothing matches that search. Try the appliance name, like "fridge".</p>'}
  </div>`;
  const qi = panel.querySelector('#q');
  qi.addEventListener('input', ()=>{ query=qi.value; renderList(); const n=panel.querySelector('#q'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); });
  panel.querySelectorAll('.row').forEach(b=>b.onclick=()=>select(b.dataset.id));
}

const modelOf = a => store.get('model:'+a.id) || '';

function renderDetail(a){
  const model = modelOf(a);
  const manualQ = encodeURIComponent((model ? model+' ' : a.name+' ') + 'manual');
  panel.innerHTML = `<div class="pad">
    <button class="back" id="back">‹ All appliances</button>
    <div><div class="eyebrow">${roomById[a.room].name} · No. ${a.n}</div><h2>${esc(a.name)}</h2></div>
    <p class="lede">${esc(a.summary)}</p>
    <div class="model"><label for="model">Model number</label>
      <input id="model" placeholder="From the label on the device" value="${esc(model)}"></div>
    <section class="block"><h4>Start here</h4>
      <ol class="steps">${a.steps.map((s,i)=>`<li><label><input type="checkbox" id="st-${a.id}-${i}"><span class="box" aria-hidden="true"></span><span>${esc(s)}</span></label></li>`).join('')}</ol>
      <div class="progress" id="prog">0 of ${a.steps.length} tried</div>
    </section>
    <section class="block"><h4>If you see…</h4>
      <div>${a.issues.map(([s,f])=>`<details><summary>${esc(s)}</summary><p>${esc(f)}</p></details>`).join('')}</div>
    </section>
    <div class="pro"><strong>Call a pro if</strong>${esc(a.pro)}</div>
    <a class="link" id="manual" href="https://www.google.com/search?q=${manualQ}" target="_blank" rel="noopener">Find the manual${model?' for '+esc(model):''} ↗</a>
    <a class="link" href="https://www.google.com/search?q=${encodeURIComponent(a.query)}" target="_blank" rel="noopener">Search this problem online ↗</a>
  </div>`;
  panel.scrollTop = 0;
  panel.querySelector('#back').onclick = ()=>{ selectedId=null; setHash(''); renderList(); refreshPins(); viewRoom(roomFilter); };
  const mi = panel.querySelector('#model');
  mi.addEventListener('input', ()=>{
    store.set('model:'+a.id, mi.value.trim());
    const m = mi.value.trim();
    const l = panel.querySelector('#manual');
    l.href = 'https://www.google.com/search?q='+encodeURIComponent((m?m+' ':a.name+' ')+'manual');
    l.textContent = 'Find the manual' + (m?' for '+m:'') + ' ↗';
  });
  const boxes = [...panel.querySelectorAll('ol.steps input')];
  boxes.forEach(b=>b.addEventListener('change', ()=>{
    const n = boxes.filter(x=>x.checked).length;
    panel.querySelector('#prog').textContent = n===boxes.length ? 'All checks tried. If it still fails, see "Call a pro".' : `${n} of ${boxes.length} tried`;
  }));
}

function select(id){
  const a = APPLIANCES.find(x=>x.id===id);
  if (!a) return;
  selectedId = id;
  setHash(id);
  renderDetail(a);
  refreshPins();
  viewAppliance(a);
}
function setHash(id){
  try{ history.replaceState(null,'', id ? '#'+id : location.pathname+location.search); }catch(e){}
}
addEventListener('hashchange', ()=>{ const id=location.hash.slice(1); if (id && id!==selectedId) select(id); });
addEventListener('keydown', e=>{ if (e.key==='Escape' && selectedId) panel.querySelector('#back')?.click(); });

renderChips();
renderList();
refreshPins();
const startId = location.hash.slice(1);
if (APPLIANCES.some(a=>a.id===startId)) select(startId);

/* ---------- LOOP ---------- */
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
function frame(now){
  if (tween){
    const t = Math.min(1,(now-tween.start)/tween.dur), k = ease(t);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (t===1) tween=null;
  }
  controls.update();
  fadeWalls();
  renderer.render(scene, camera);
  placePins();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
